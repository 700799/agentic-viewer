site_name: Agent Canvas
site_description: A visual, Airflow-style canvas for observing Claude Code and AI-agent workflows
site_url: https://700799.github.io/agentic-viewer/
repo_url: https://github.com/700799/agentic-viewer
repo_name: 700799/agentic-viewer
edit_uri: edit/main/docs/

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.sections
    - navigation.top
    - navigation.instant
    - content.code.copy
    - content.action.edit
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  # Renders the ```mermaid blocks used throughout architecture.md and example-dag.md
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Architecture: architecture.md
  - Canonical schema: canonical-schema.md
  - Database: database.md
  - API: api.md
  - Roadmap: roadmap.md
  - Screenshots: screenshots.md
  - Adapters:
      - Claude Code: adapters/claude-code.md
      - OpenAI Agents SDK: adapters/openai-agents.md
      - LangGraph: adapters/langgraph.md
      - CrewAI: adapters/crewai.md
      - AutoGen: adapters/autogen.md
  - Examples:
      - Airflow-style DAG: examples/example-dag.md
  - License: license.md
